name: Refresh dependency lock

on:
  push:
    branches:
      - feat/runtime-provider-actions-e2b-2026-09-30
    paths:
      - apps/api/package.json
      - package-lock.json
      - .github/workflows/lock-refresh.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/runtime-provider-actions-e2b-2026-09-30
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package lock for E2B provider"
          git push origin HEAD:feat/runtime-provider-actions-e2b-2026-09-30
