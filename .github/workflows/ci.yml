name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: orlynx-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned mini-SWE integration runtime
        run: bash scripts/install-mini-swe-runtime.sh

      - name: Check production supervisor syntax
        run: node --check apps/api/scripts/production-start.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        env:
          ORLYNX_MINI_SWE_PYTHON: ${{ github.workspace }}/.runner-mini-swe/bin/python
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify compiled provider runtime
        run: npm run verify:provider-runtime --workspace=@orlynx/api


  runner-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check runner runtime scripts
        run: |
          node --check runner-manager/index.mjs
          node --check runner-runtime/preview-proxy.mjs
          node --check runner-direct/index.mjs

      - name: Build runner runtime image
        run: docker build --file runner-runtime/Dockerfile --tag orlynx-runner-runtime:ci .

      - name: Verify runner Chromium can actually launch
        run: docker run --rm orlynx-runner-runtime:ci node /opt/orlynx/browser-smoke.mjs

      - name: Build runner manager image
        run: docker build --file runner-manager/Dockerfile --tag orlynx-runner-manager:ci .


  publish-runner-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - runner-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build and publish runner runtime
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/orlynx-runner-runtime
        run: |
          docker build --file runner-runtime/Dockerfile             --tag "$IMAGE:${GITHUB_SHA}"             --tag "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Build and publish runner manager
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/orlynx-runner-manager
        run: |
          docker build --file runner-manager/Dockerfile             --tag "$IMAGE:${GITHUB_SHA}"             --tag "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

# Runner fleet deploys are commit-driven (autoDeploy=yes on each runner
# service, same as the web service). Do NOT add a CI deploy job as well:
# that creates a second deployment for the same SHA. scripts/
# render-deploy-runners.mjs remains for manual one-shot fleet rolls
# (pinned SHA, drift-checked); it needs RENDER_API_KEY plus
# RENDER_RUNNER_SERVICE_IDS in the invoking environment.
# Render web deploys are commit-driven (autoDeploy=yes). Do not call a deploy
# hook from CI as well: that creates a second deployment for the same SHA.
