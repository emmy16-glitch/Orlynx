name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: orlynx-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify compiled provider runtime
        run: npm run verify:provider-runtime --workspace=@orlynx/api


  runner-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check runner manager syntax
        run: node --check runner-manager/index.mjs

      - name: Build runner runtime image
        run: docker build --file runner-runtime/Dockerfile --tag orlynx-runner-runtime:ci .

      - name: Build runner manager image
        run: docker build --file runner-manager/Dockerfile --tag orlynx-runner-manager:ci .
